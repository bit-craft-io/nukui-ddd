syntax = "proto3";

package health.v1;

option go_package = "internal.local/bit-craft-io/sandbox/gs/gen/healthpb;healthpb";
option php_namespace = "Protobuf\\Health\\V1";

message ReqHealth {
  string message = 1;
  bool in_progress = 2;
  int64 timestamp = 3;
}

message ResHealth {
  bool is_success = 1;
  string message = 2;
}
